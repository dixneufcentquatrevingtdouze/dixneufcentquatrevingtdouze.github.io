<head>
    <!-- Open Graph -->
    <meta property="og:type" content="article">
    <meta property="og:title" content="{{ page.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 200 }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="{{ site.title }}">

    {% if page.image %}
        <meta property="og:image" content="{{ page.image | absolute_url }}">
    {% endif %}

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | escape }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 200 }}">

    {% if page.image %}
        <meta name="twitter:image" content="{{ page.image | absolute_url }}">
    {% endif %}
</head>
